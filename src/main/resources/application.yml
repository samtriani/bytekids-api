server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: bytekids-academy-api

  jackson:
    time-zone: ${TZ:America/Mexico_City}
    default-property-inclusion: non_null

  # SIN valores por defecto: la app debe fallar al arrancar si falta un secreto,
  # no caer silenciosamente a la base de produccion. Este archivo esta en un repo
  # publico. Para desarrollo local usa application-local.yml (ya en .gitignore).
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${BK_DB_URL}
    username: ${BK_DB_USER}
    password: ${BK_DB_PASSWORD}
    hikari:
      minimum-idle: ${POOL_MINIMUM_IDLE:2}
      maximum-pool-size: ${POOL_MAX_SIZE:10}
      connection-timeout: ${POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${POOL_LIFETIME:1800000}
      pool-name: ByteKidsPool

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    # Únicos usuarios que pueden crear o modificar cuentas de coordinador
    # (admin) y director. Separar con comas. Se cambia en caliente con:
    #   flyctl secrets set OWNER_USERNAMES="samuel.partida,otro.usuario"
    owner-usernames: ${OWNER_USERNAMES:samuel.partida}
  jwt:
    # Minimo 32 caracteres o la app no arranca; 64+ para que use HS512.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}   # 7 días
  jaas:
    app-id: ${JAAS_APP_ID:vpaas-magic-cookie-7825138c95d24c7cb6f660d4a535d186}
    key-id: ${JAAS_KEY_ID:8a0eae}
    # PEM completo en base64. En produccion es el secret JAAS_PRIVATE_KEY.
    private-key: ${JAAS_PRIVATE_KEY:}
    # Respaldo solo para desarrollo local, con el archivo fuera del repo.
    private-key-path: ${JAAS_KEY_PATH:}
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:1234/v1}
    model: ${AI_MODEL:meta-llama-3.1-8b-instruct}
    max-tokens: ${AI_MAX_TOKENS:600}
    api-key: ${AI_API_KEY:}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: mx.bytekids.academy.controller
