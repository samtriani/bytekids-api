server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: bytekids-academy-api

  jackson:
    time-zone: ${TZ:America/Mexico_City}
    default-property-inclusion: non_null

  # SIN valores por defecto: la app debe fallar al arrancar si falta un secreto,
  # no caer silenciosamente a la base de produccion. Este archivo esta en un repo
  # publico. Para desarrollo local usa application-local.yml (ya en .gitignore).
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${BK_DB_URL}
    username: ${BK_DB_USER}
    password: ${BK_DB_PASSWORD}
    # Neon cierra las conexiones cuando la base se duerme (~5 min sin uso) y
    # Fly congela la maquina entera. Con conexiones de 30 min guardadas, al
    # volver Hikari probaba una por una conexiones muertas (~10 s cada una)
    # hasta rendirse a los 30 s: el quiz se quedaba "trabado". Ahora:
    # conexiones de vida corta, que se descartan rapido si estan muertas, y
    # se rinde en 15 s con 503, que el front reintenta solo.
    # Variables HIKARI_* y no POOL_*: en Fly hay secretos POOL_* con los
    # valores viejos que pisaban estos. Si ya no se usan, se pueden borrar.
    hikari:
      minimum-idle: ${HIKARI_MINIMUM_IDLE:0}
      maximum-pool-size: ${HIKARI_MAX_SIZE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:15000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:2000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:120000}
      max-lifetime: ${HIKARI_LIFETIME:240000}
      keepalive-time: ${HIKARI_KEEPALIVE:60000}
      pool-name: ByteKidsPool
      data-source-properties:
        tcpKeepAlive: true

  jpa:
    # Apagado en produccion: imprimir y formatear CADA consulta cuesta CPU y
    # ahoga los logs, que es justo donde se buscan los errores reales. Para
    # depurar en local: SHOW_SQL=true.
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: ${SHOW_SQL:false}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    # Únicos usuarios que pueden crear o modificar cuentas de coordinador
    # (admin) y director. Separar con comas. Se cambia en caliente con:
    #   flyctl secrets set OWNER_USERNAMES="samuel.partida,otro.usuario"
    owner-usernames: ${OWNER_USERNAMES:samuel.partida}
    login:
      # Freno de fuerza bruta en /auth/login. Solo cuentan los intentos
      # fallidos y un login correcto borra el contador, asi que 10 no le
      # estorba a nadie que sepa su contrasena. Ver LoginRateLimitFilter.
      max-intentos: ${LOGIN_MAX_INTENTOS:10}
      ventana-minutos: ${LOGIN_VENTANA_MINUTOS:15}
  jwt:
    # Minimo 32 caracteres o la app no arranca; 64+ para que use HS512.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}   # 7 días
  jaas:
    app-id: ${JAAS_APP_ID:vpaas-magic-cookie-7825138c95d24c7cb6f660d4a535d186}
    key-id: ${JAAS_KEY_ID:8a0eae}
    # PEM completo en base64. En produccion es el secret JAAS_PRIVATE_KEY.
    private-key: ${JAAS_PRIVATE_KEY:}
    # Respaldo solo para desarrollo local, con el archivo fuera del repo.
    private-key-path: ${JAAS_KEY_PATH:}
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:1234/v1}
    model: ${AI_MODEL:meta-llama-3.1-8b-instruct}
    max-tokens: ${AI_MAX_TOKENS:600}
    api-key: ${AI_API_KEY:}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      # 'always' exponia a cualquier visitante el motor de base de datos, la
      # ruta dentro del contenedor y el espacio libre en disco: este endpoint
      # es publico porque Fly necesita consultarlo sin credenciales. Con
      # 'never' sigue sirviendo de health check —responde UP/DOWN— y deja de
      # ser un mapa gratis de la infraestructura.
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: mx.bytekids.academy.controller
