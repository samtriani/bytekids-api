# fly.toml app configuration file generated for bytekids-api on 2026-05-27T22:29:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bytekids-api'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 'suspend' congela la RAM en vez de apagar la maquina: el arranque en frio
  # de Spring Boot pasa de ~40s a ~1-2s. Con 'stop' el primer request tras un
  # rato de inactividad se caia y el usuario veia pantallas en cero.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
